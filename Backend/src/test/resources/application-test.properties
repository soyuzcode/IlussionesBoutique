# Isolated test profile. Tests never connect to Supabase/PostgreSQL.
spring.datasource.url=jdbc:h2:mem:ilussioness-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The production profile keeps ddl-auto=validate against Supabase. This test
# profile owns a disposable in-memory schema, so Hibernate may create it here.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

supabase.jwt.secret=test-only-not-a-real-secret
