# Live HTTP smoke-test profile: runs the real application on the test classpath
# with an isolated in-memory H2 database, so the endpoints can be exercised with
# curl without touching Supabase.
spring.datasource.url=jdbc:h2:mem:httptest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.port=18080

supabase.jwt.secret=test-only-not-a-real-secret

# Credentials used only by the local httptest profile (H2, port 18080).
app.auth.jwt-secret=httptest-only-jwt-secret-0123456789abcdef0123456789abcdef
app.auth.token-ttl-minutes=60
app.auth.demo.email=admin@ilussiones.com
app.auth.demo.password=DemoPass123!
app.auth.demo.name=Admin
app.auth.demo.role=ADMIN
