# Live HTTP smoke-test profile: runs the real application on the test classpath
# with an isolated in-memory H2 database, so the endpoints can be exercised with
# curl without touching Supabase.
spring.datasource.url=jdbc:h2:mem:httptest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.port=18080

supabase.jwt.secret=test-only-not-a-real-secret
