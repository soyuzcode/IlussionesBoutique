spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.application.name=ilussioness-backend

# Audit ingestion limits. The endpoint is intentionally public while the
# application has no authentication, so keep these bounded.
audit.ingestion.max-body-bytes=4096
audit.ingestion.rate-limit-per-minute=60
audit.ingestion.rate-limit-window-seconds=60

supabase.jwt.secret=${SUPABASE_JWT_SECRET}

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0