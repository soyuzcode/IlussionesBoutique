spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.application.name=ilussioness-backend

# Audit ingestion limits. The ingestion endpoint stays public because the
# frontend emits pre-login events; payloads are validated and rate-limited.
audit.ingestion.max-body-bytes=4096
audit.ingestion.rate-limit-per-minute=60
audit.ingestion.rate-limit-window-seconds=60

supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# ---------------------------------------------------------------------------
# Demo authentication (backend authority).
# These defaults are for local development only. In any shared environment
# override every value with environment variables; never commit real secrets.
# The password is hashed with BCrypt at startup and is never stored in the DB.
# ---------------------------------------------------------------------------
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:dev-only-ilussiones-jwt-secret-change-me-2026}
app.auth.token-ttl-minutes=${APP_AUTH_TOKEN_TTL_MINUTES:60}
app.auth.demo.email=${APP_DEMO_AUTH_EMAIL:admin@ilussiones.com}
app.auth.demo.password=${APP_DEMO_AUTH_PASSWORD:Ilussiones2026!}
app.auth.demo.name=${APP_DEMO_AUTH_NAME:Admin}
app.auth.demo.role=${APP_DEMO_AUTH_ROLE:ADMIN}


spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0