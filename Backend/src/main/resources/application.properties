spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.application.name=ilussioness-backend

# Audit ingestion limits. The ingestion endpoint stays public because the
# frontend emits pre-login events; payloads are validated and rate-limited.
audit.ingestion.max-body-bytes=4096
audit.ingestion.rate-limit-per-minute=60
audit.ingestion.rate-limit-window-seconds=60

supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# ---------------------------------------------------------------------------
# Demo authentication (backend authority).
# These defaults are for local development only. In any shared environment
# override every value with environment variables; never commit real secrets.
# The password is hashed with BCrypt at startup and is never stored in the DB.
# ---------------------------------------------------------------------------
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:dev-only-ilussiones-jwt-secret-change-me-2026}
app.auth.token-ttl-minutes=${APP_AUTH_TOKEN_TTL_MINUTES:60}
# Remembered session (HttpOnly cookie). SameSite=None + Secure is required while
# the frontend (Vercel) and the API (Railway) are on different sites.
app.auth.session.ttl-days=${APP_SESSION_TTL_DAYS:14}
app.auth.session.secure=${APP_SESSION_COOKIE_SECURE:true}
app.auth.session.same-site=${APP_SESSION_COOKIE_SAME_SITE:None}
# Frontend origins allowed to use the session cookie (APP_FRONTEND_URL is always added).
app.auth.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ilussiones-boutique.vercel.app,https://ilussiones-boutique-*-key-code1.vercel.app}
app.auth.demo.email=${APP_DEMO_AUTH_EMAIL:admin@ilussiones.com}
app.auth.demo.password=${APP_DEMO_AUTH_PASSWORD:Ilussiones2026!}
app.auth.demo.name=${APP_DEMO_AUTH_NAME:Admin}
app.auth.demo.role=${APP_DEMO_AUTH_ROLE:ADMIN}


spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
# Frontend URL used in password-reset links and OAuth redirects back to the UI.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.auth.password-reset.ttl-minutes=${APP_PASSWORD_RESET_TTL_MINUTES:30}
# Dev only: log the reset link when SMTP is not configured.
app.auth.password-reset.log-link=${APP_PASSWORD_RESET_LOG_LINK:false}

# SMTP (optional). Password-reset and reminder e-mails are sent only when set.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:no-reply@ilussiones.com}

# Appointment reminder e-mails (digest to the boutique).
app.reminders.enabled=${APP_REMINDERS_ENABLED:false}
app.reminders.notify-email=${APP_REMINDERS_NOTIFY_EMAIL:}
app.reminders.lead-hours=${APP_REMINDERS_LEAD_HOURS:24}
app.reminders.cron=${APP_REMINDERS_CRON:0 */15 * * * *}

# Google Calendar / Microsoft Outlook (optional OAuth apps).
app.calendar.redirect-base-url=${APP_CALENDAR_REDIRECT_BASE_URL:http://localhost:8080}
app.calendar.time-zone=${APP_TIME_ZONE:America/El_Salvador}
app.calendar.event-duration-minutes=${APP_CALENDAR_EVENT_MINUTES:60}
app.calendar.token-encryption-key=${APP_CALENDAR_TOKEN_KEY:}
app.calendar.google.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.calendar.google.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.calendar.microsoft.client-id=${MICROSOFT_CALENDAR_CLIENT_ID:}
app.calendar.microsoft.client-secret=${MICROSOFT_CALENDAR_CLIENT_SECRET:}
app.calendar.microsoft.tenant=${MICROSOFT_CALENDAR_TENANT:common}
